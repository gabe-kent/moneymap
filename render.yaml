# Free-tier Postgres expires ~30 days after creation and gets auto-suspended by
# Render's billing system (see docs/environment-setup-runbook.md, Phase 2 Step 3).
# When that happens: delete the suspended instance in the dashboard, then push any
# commit (or trigger a Manual Sync on the Blueprint's page) -- Render recreates a
# Blueprint-managed resource it can't find, matching this exact declaration, and
# DATABASE_URL below re-resolves to it automatically via fromDatabase.
databases:
  - name: moneymap-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: moneymap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: moneymap-db
          property: connectionString
      # Run Solid Queue inside the web dyno instead of a separate worker
      # service, since background workers aren't available on the free plan.
      # Move this to a dedicated `type: worker` service (see git history)
      # once there's real job volume or you upgrade off free.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Optional: set both to seed a personal login on this service, since
      # there's no self-serve sign-up yet and SSH/shell access isn't
      # available on the free plan. See db/seeds.rb.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
